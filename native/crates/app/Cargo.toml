[package]
name = "app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "vsrustium"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
config = { path = "../config" }
exthost = { path = "../exthost" }
files = { path = "../files" }
flate2 = "1"
futures = "0.3"
icu_collator = "2"
ttf-parser = "0.25"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "block2", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSKeyValueCoding", "NSOperation", "NSProcessInfo", "NSString", "NSURL", "NSURLRequest", "NSURLResponse", "NSURLSession", "NSValue", "block2", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKNavigation", "WKPreferences", "WKScriptMessage", "WKScriptMessageHandler", "WKURLSchemeHandler", "WKURLSchemeTask", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration", "block2", "objc2-app-kit", "objc2-core-foundation"] }
raw-window-handle = "0.6"
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit"] }
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
serde.workspace = true
sha2 = "0.10"
serde_json.workspace = true
storage = { path = "../storage" }
regex = "1"
onig = { version = "6.5", default-features = false }
search = { path = "../search" }
textmate = { path = "../textmate" }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[features]
screenshot = ["gpui/test-support", "gpui_platform/test-support"]
