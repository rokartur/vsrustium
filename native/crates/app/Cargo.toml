[package]
name = "app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "code-gpui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
config = { path = "../config" }
exthost = { path = "../exthost" }
files = { path = "../files" }
flate2 = "1"
futures = "0.3"
icu_collator = "2"
ttf-parser = "0.25"
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit"] }
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
serde_json.workspace = true
storage = { path = "../storage" }
regex = "1"
onig = { version = "6.5", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
search = { path = "../search" }
textmate = { path = "../textmate" }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[features]
screenshot = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]
