[package]
name = "app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "code-gpui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
exthost = { path = "../exthost" }
flate2 = "1"
futures = "0.3"
icu_collator = "2"
ttf-parser = "0.25"
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit"] }
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[features]
screenshot = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]
